<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Rex Groups helps ambitious businesses grow through technology, digital experiences and practical business solutions." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rex Groups | Technology. Business. Innovation." />
    <meta property="og:description" content="Websites, e-commerce and digital solutions for ambitious businesses." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b0d10'/%3E%3Ctext x='12' y='48' font-family='Arial' font-weight='800' font-size='44' fill='%23f3f4f2'%3ER%3C/text%3E%3Ccircle cx='50' cy='46' r='5' fill='%23d6ff65'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('rex-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f6f3' : '#0b0d10');
        } catch (e) {}
      })();
    </script>
    <title>Rex Groups | Technology. Business. Innovation.</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Please enable JavaScript to view the Rex Groups website.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
